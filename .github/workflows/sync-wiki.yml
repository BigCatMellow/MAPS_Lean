name: Sync agent onboarding wiki

on:
  push:
    branches:
      - main
    paths:
      - docs/wiki/**
      - .github/workflows/sync-wiki.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical wiki source
        uses: actions/checkout@v4

      - name: Clone live GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-out

      - name: Replace wiki projection from reviewed source
        run: |
          find wiki-out -maxdepth 1 -type f -name '*.md' -delete
          cp docs/wiki/*.md wiki-out/

      - name: Publish only when content changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd wiki-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki already matches canonical source."
            exit 0
          fi
          git commit -m "Sync agent onboarding wiki from main"
          git push origin HEAD
