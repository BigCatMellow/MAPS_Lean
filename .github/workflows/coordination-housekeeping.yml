name: Coordination backlog housekeeping

# Runs the mechanical PR housekeeping in scripts/coordination_housekeeping.py
# when manually dispatched. It only promotes drafts that already posted
# handoff evidence and have green CI, and retargets PRs whose base branch was
# already squash-merged into main by an upstream PR. It never merges, approves,
# or closes.

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Promote ready drafts and retarget orphaned stacked PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/coordination_housekeeping.py "${{ github.repository }}" --apply
