name: Wiki audit publish

on:
  push:
    branches:
      - audit/wiki-agent-onboarding
    paths:
      - .github/workflows/wiki-audit-snapshot.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audited source
        uses: actions/checkout@v4

      - name: Run documentation guards
        run: python -m unittest tests.test_documentation_sprawl -v

      - name: Clone live GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-out

      - name: Replace live wiki from audited source
        run: |
          find wiki-out -maxdepth 1 -type f -name '*.md' -delete
          cp docs/wiki/*.md wiki-out/

      - name: Publish audited wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd wiki-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki already matches audited source."
            exit 0
          fi
          git commit -m "Rewrite wiki for fresh-agent MAPS_L onboarding"
          git push origin HEAD

# Final one-shot audit publisher. Delete after successful live verification.
