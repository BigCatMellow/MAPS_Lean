name: review-evidence

# Issue #61 Option B: requires a committed, exact-head-bound review-evidence
# file (work/reviews/pr-<N>-review-evidence.md) before a PR can merge. Does
# NOT prove reviewer identity is distinct from the author -- see
# scripts/check_review_evidence.py and
# work/notes/2026-08-17-independent-review-enforcement-design.md.
#
# Also runs scripts/check_stale_no_caller_docstrings.py (CLAUDE.md rule 20
# safeguard: fails when a runtime docstring still claims a symbol has "no
# production caller" after one was added) and
# scripts/check_coverage_note_pins.py (rule 20 safeguard: fails when a
# self-describing coverage note in context_builder.py has no test pinning it --
# work/notes/2026-09-01-invariant-prose-drift-safeguard-design.md).

on:
  pull_request:

permissions:
  contents: read

jobs:
  review-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify no stale "no production caller" docstrings
        run: python scripts/check_stale_no_caller_docstrings.py

      - name: Verify every context-builder coverage note is test-pinned
        run: python scripts/check_coverage_note_pins.py

      - name: Verify review evidence for exact head
        run: python scripts/check_review_evidence.py "${{ github.event.pull_request.number }}"
