name: review-evidence

# Issue #61 Option B: requires a committed, exact-head-bound review-evidence
# file (work/reviews/pr-<N>-review-evidence.md) before a PR can merge. Does
# NOT prove reviewer identity is distinct from the author -- see
# scripts/check_review_evidence.py and
# work/notes/2026-08-17-independent-review-enforcement-design.md.
#
# Also runs the active repository safeguards for stale caller docstrings,
# context-builder coverage-note pins, registered/receipted handoffs, and the
# PR #341 protocol-benchmark resolved-finding anchors.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify no stale "no production caller" docstrings
        run: python scripts/check_stale_no_caller_docstrings.py

      - name: Verify every context-builder coverage note is test-pinned
        run: python scripts/check_coverage_note_pins.py

      - name: Verify every handoff is registered and receipted
        run: python scripts/check_handoff_receipts.py

      - name: Verify protocol benchmark resolved-finding anchors
        run: python scripts/check_protocol_effectiveness_benchmark_anchors.py

      - name: Verify review evidence for exact head
        run: python scripts/check_review_evidence.py "${{ github.event.pull_request.number }}"
