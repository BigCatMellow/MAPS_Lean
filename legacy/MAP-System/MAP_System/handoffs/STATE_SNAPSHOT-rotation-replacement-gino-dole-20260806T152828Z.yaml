lexicon:
  StarCraftCA / SCTMG / "StarCraft RPG Companion Design": The operator's personal,
    non-MAP creative project - a tabletop-game companion web app (plain .dc.html component
    files + a small Node build pipeline that regenerates *-data.js from uploads/*.html
    rules/unit source). Lives entirely outside this git repo at /home/mellow/Documents/Projects/StarCraftCA/.
  .dc.html: This project's own single-file component convention - each top-level screen
    is one file using <dc-import> to embed sub-components like UnitDetail. No native
    browser dialogs (alert/confirm/prompt) are used anywhere in this app. Screens
    navigate via plain <a href="Other.dc.html"> links, not an SPA router - so cross-screen
    state only survives via localStorage, read fresh on each page's componentDidMount.
  War Room: Missions.dc.html's on-screen label (data-screen-label="War Room"). Lets
    the operator pick battle size, a mission, and a map. Shares round/phase/VP state
    (`sctmg_play` localStorage key) with Command Center.dc.html and the 3 REAL faction
    Army files (Terran/Zerg/Protoss). As of this session, also writes `missionId`
    into that same shared key.
  Battle tab: A tab within each Army .dc.html file's own bottom nav (Roster/Battle/Codex
    for Test Army; similar for the real files) - tracks per-unit model losses and
    deployment status during actual play, separate from roster-building.
  Export Army Sheet: A button on the Roster tab that calls exportArmySheet(), which
    builds a standalone printable HTML document (own inline CSS via printSheetCss(),
    no external stylesheet) as a Blob and opens it via URL.createObjectURL + window.open.
  missions-data.js / window.SCTMG_MISSIONS: exposes MISSIONS and MAPS arrays - mission
    objects have id, name, type, supply, perRound, gameLength, etc. Was only loaded
    by Missions.dc.html before this session; now also loaded by Test Army.dc.html.
  Test Army.dc.html: The operator's sandbox/test file for this project - NOT linked
    from Command Center, uses an isolated `sctmg_play_test` localStorage key for its
    own round tracker (deliberately, so testing doesn't corrupt real game state),
    but as of this session ALSO reads `missionId` from the shared `sctmg_play` key
    since mission selection is treated as a single global concept, not per-army-instance.
  dev server: python3 -m http.server 8934, served from inside the external project
    folder. Confirmed running and responsive at snapshot time (localhost:8934).
