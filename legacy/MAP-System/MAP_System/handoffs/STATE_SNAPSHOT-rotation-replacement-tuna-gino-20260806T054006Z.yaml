lexicon:
  StarCraftCA / SCTMG / "StarCraft RPG Companion Design": The operator's personal,
    non-MAP creative project - a tabletop-game companion web app (plain .dc.html component
    files + a small Node build pipeline that regenerates *-data.js from uploads/*.html
    rules/unit source). Lives entirely outside this git repo at /home/mellow/Documents/Projects/StarCraftCA/.
  .dc.html: This project's own single-file component convention - each top-level screen
    is one file using <dc-import> to embed sub-components like UnitDetail. No native
    browser dialogs (alert/confirm/prompt) are used anywhere in this app; any are-you-sure
    needs are built as inline two-tap UI state instead (see Saved Rosters delete).
  Saved Rosters: Feature added to Terran in the prior session (e60f23c), now ported
    to all four army files this session (22443f3 Zerg, 0bfe0c5 Protoss, acf8777 Test).
    Lets the operator save multiple NAMED snapshots of the current roster+battle state,
    browse/load/delete them from a bottom-sheet reached via a button next to "Export
    Army Sheet" on the Roster tab, and export/import individual saved rosters as .sctmg.json
    files. Each faction file uses its own localStorage key (sctmg_<faction>_rosters_v1)
    so saved rosters don't cross-contaminate between factions.
  Test Army.dc.html: A sandbox copy of Terran Army.dc.html with its own isolated localStorage
    keys (sctmg_test_v1, sctmg_play_test, and now sctmg_test_rosters_v1) so it can
    be broken freely without touching the real Terran roster. It has its own persistent
    3-unit test roster (Goliath/Marauder/Marine) that predates this session and was
    left untouched.
