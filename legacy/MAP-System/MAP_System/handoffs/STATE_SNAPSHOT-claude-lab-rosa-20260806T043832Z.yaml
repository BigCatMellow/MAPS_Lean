lexicon:
  StarCraftCA / SCTMG / "StarCraft RPG Companion Design": The operator's personal,
    non-MAP creative project - a tabletop-game companion web app (plain .dc.html component
    files + a small Node build pipeline that regenerates *-data.js from uploads/*.html
    rules/unit source). Lives entirely outside this git repo at /home/mellow/Documents/Projects/StarCraftCA/.
  .dc.html: This project's own single-file component convention - each top-level screen
    is one file using <dc-import> to embed sub-components like UnitDetail.
  Test Army.dc.html: A sandbox copy of Terran Army.dc.html with its own isolated localStorage
    keys (sctmg_test_v1, sctmg_play_test) so it can be broken freely without touching
    the real Terran roster or the shared round tracker. Header reads 'Sandbox - Not
    Live Data'. Historically where Battle-tab prototyping happens first, now kept
    in sync with the live faction files for nav-structure consistency (e.g. the tab
    reorder).
  Battle tab: Live on all three faction Army.dc.html files (and Test). Tracks
    live-game state on top of the roster - per-unit model losses (with automatic
    tier-bracket/supply recalculation as a unit shrinks), a Deployed/In-Reserves toggle
    per unit gated against a manually-steppered Deployment Supply pool, and a Tapped/Ready
    toggle for equipped tactical cards.
  HUD scoreboard: The tap-to-open round/phase/VP bar at the top of every tab, now
    on every tab, not just Battle. Round on the left, big VP score centered, Phase
    as a two-line label+name stack on the right, full width matching other cards.
    Tapping it still opens the same bottom-sheet Round Tracker modal as before; that
    modal itself renders with bigger controls only when opened from the Battle tab.
  Nav tab order: Command/Brood/Nexus, Library, Tactics, Roster, Battle, Codex - follows
    the build-then-play sequence. Changed from the original Roster, Battle, Library,
    Tactics, Command, Codex order this session. Default landing tab is still 'roster'
    in app state regardless of nav position.
  dev server: python3 -m http.server 8934, served from inside the external project
    folder. Confirmed running at end of this session.
  TASK-318: The MAP task that originally scoped the CSS-consolidation work; all 5
    original acceptance criteria are DONE/SUBMITTED. Everything since (including
    this entire session) is informal follow-on work under the same hcom hand-off
