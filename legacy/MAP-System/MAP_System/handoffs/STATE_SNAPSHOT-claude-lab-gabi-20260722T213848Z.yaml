single_strongest_finding: 'SYN-0001 recurred FOUR times in this single session, and
  each time the failure looked like an unrelated bug: the claim_review reviewer-registration
  trap, the TASK-186 exporter/watcher terminality conflict, the helper-tier rule with
  nowhere to write its answer (TASK-269), and claim_task updating SQLite without mirrors
  (INS-0038). Every one is the same shape -- one piece of state, two readers, no declared
  authority -- and SYN-0001 named that shape on 2026-07-02 and was recorded CLARIFIED
  and never acted on. The sharpest detail is that MAP already contains the correct
  pattern: declare_standby.py writes SQLite then exports in the same command and reports
  "SQLite updated, mirrors exported". The system is not missing the idea. It is failing
  to apply an idea it already had, and it will keep paying this tax per-incident until
  SYN-0001 is landed as a rule rather than a note. That belongs above new feature
  work in any realignment plan.

  '
