- id: task-186-terminal-suppression
  summary: 'APPROVED. The feature was structurally unreachable, not merely buggy:
    export_to_files.py lists both terminal reasons in NON_OPERATIONAL_REASONS and
    drops those agents from status.json at line 132, while limit_watcher.py resolved
    terminality FROM status.json at lines 851/859. The exporter deleted the row the
    watcher needed. Measured on live state it fired for 2 of 11 incident-holding agents,
    and those 2 survived the filter only because they happened to own active tasks.
    Operator chose option A; terminality now resolves from the SQLite agents table
    via load_durable_terminal_agents() and apply_durable_lifecycle(). Seven dead sessions
    marked inactive/session_superseded.

    '
  residual: 'RELEASE GATE STILL OPEN. The live systemd unit map-rns-watcher.service
