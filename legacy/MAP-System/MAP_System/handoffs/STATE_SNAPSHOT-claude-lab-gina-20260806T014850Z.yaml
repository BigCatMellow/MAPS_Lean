lexicon:
  StarCraftCA / SCTMG / "StarCraft RPG Companion Design": The operator's personal, non-MAP creative project
    - a tabletop-game companion web app (plain .dc.html component files + a small Node build pipeline
    that regenerates *-data.js from uploads/*.html rules/unit source). Lives entirely outside this git
    repo at /home/mellow/Documents/Projects/StarCraftCA/.
  .dc.html: This project's own single-file component convention - each top-level screen is one file using
    <dc-import> to embed sub-components like UnitDetail.
  Test Army.dc.html: A sandbox copy of Terran Army.dc.html with its own isolated localStorage keys (sctmg_test_v1,
    sctmg_play_test) so it can be broken freely without touching the real Terran roster or the shared
    round tracker. Header reads 'Sandbox - Not Live Data'. This is where all Battle-tab prototyping is
    happening; not linked from Command Center or anywhere else in the app nav - reach it by direct URL
    only.
  Battle tab: New 6th tab (flag icon), sandbox-only so far. Tracks live-game state on top of the roster
    you already built - per-unit model losses (with automatic tier-bracket/supply recalculation as a unit
    shrinks), a Deployed/In-Reserves toggle per unit gated against a manually-steppered Deployment Supply
    pool, and a Tapped/Ready toggle for equipped tactical cards. Shows the round/phase/VP tracker fully
    expanded inline (not the tap-to-open bar every other tab uses) since that's the whole point of being
    on that tab.
  dev server: python3 -m http.server 8934, served from inside the external project folder. Confirmed running
    at end of this session. If it's down, cd into that folder and restart it.
  TASK-318: The MAP task that originally scoped the CSS-consolidation work; see map_task.py show TASK-318
    for the original 5 acceptance criteria (all DONE, task SUBMITTED). Everything since is informal follow-on
    work under the same hcom hand-off chain, not a new formal task.
