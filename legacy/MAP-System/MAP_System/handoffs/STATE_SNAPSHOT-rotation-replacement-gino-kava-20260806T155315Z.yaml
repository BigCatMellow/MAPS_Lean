lexicon:
  StarCraftCA / SCTMG / "StarCraft RPG Companion Design": The operator's personal,
    non-MAP creative project - a tabletop-game companion web app (plain .dc.html component
    files plus a small Node build pipeline that regenerates *-data.js from uploads/*.html
    rules and unit source). Lives entirely outside this git repo at /home/mellow/Documents/Projects/StarCraftCA/.
  .dc.html: This project's own single-file component convention - each top-level screen
    is one file using dc-import to embed sub-components like UnitDetail. No native
    browser dialogs (alert, confirm, prompt) are used anywhere in this app. Screens
    navigate via plain anchor links to other .dc.html files, not an SPA router - so
    cross-screen state only survives via localStorage, read fresh on each page's componentDidMount.
    Templates only support plain double-brace variable substitution (verified this
    session by grepping for ternary and expression patterns in templates and finding
    none) - all conditional text or values must be precomputed in render() and exposed
    as plain named fields, never inlined as expressions in the template markup.
  War Room: Missions.dc.html's on-screen label. Lets the operator pick battle size,
    a mission, and a map. Shares round, phase, and VP state (the sctmg_play localStorage
    key) with Command Center.dc.html and the 3 REAL faction Army files (Terran, Zerg,
    Protoss). As of the prior session also writes missionId into that key; as of this
    session also writes mapId, and accepts an optional tab URL param (setup, missions,
    or maps) to force which of its own three sub-tabs it opens on, overriding its
    normal persisted-last-tab behavior.
  Battle tab: A tab within each Army .dc.html file's own bottom nav (Roster, Battle,
    Codex for Test Army; similar for the real files) - tracks per-unit model losses
    and deployment status during actual play, separate from roster-building. As of
    this session shows a single-line badge (mission plus map combined) that links
    back to War Room's Setup tab.
  Export Army Sheet: A button on the Roster tab that calls exportArmySheet(), which
    builds a standalone printable HTML document (own inline CSS via printSheetCss(),
    no external stylesheet) as a Blob and opens it via URL.createObjectURL plus window.open.
    Header now includes both MISSION and MAP when selected.
  missions-data.js / window.SCTMG_MISSIONS: Exposes MISSIONS and MAPS arrays - mission
    objects have id, name, type, supply, perRound, gameLength, etc.; map objects have
    id, name, size, type, width, height, blueZones, redZones, markers, etc. Was only
    loaded by Missions.dc.html before the prior session; now also loaded by Test Army.dc.html.
  Test Army.dc.html: The operator's sandbox/test file for this project - NOT linked
    from Command Center, uses an isolated sctmg_play_test localStorage key for its
    own round tracker (deliberately, so testing doesn't corrupt real game state),
    but reads missionId and mapId from the shared sctmg_play key since mission and
    map selection are treated as a single global concept, not per-army-instance.
  dev server: python3 -m http.server 8934, served from inside the external project
    folder. Confirmed running and responsive at snapshot time (localhost:8934).
