lexicon:
  StarCraftCA / SCTMG / "StarCraft RPG Companion Design": The operator's personal,
    non-MAP creative project - a tabletop-game companion web app (plain .dc.html component
    files + a small Node build pipeline that regenerates *-data.js from uploads/*.html
    rules/unit source). Lives entirely outside this git repo at /home/mellow/Documents/Projects/StarCraftCA/.
  .dc.html: This project's own single-file component convention - each top-level screen
    is one file using <dc-import> to embed sub-components like UnitDetail. The templating
    engine (support.js) resolves double-brace expressions as dotted-path property
    access plus leading negation, proven to work inside sc-for loop-variable scope
    (e.g. a loop var r's r.confirming property negated) - but it does NOT support
    arbitrary JS expressions, only paths, literals, top-level negation, and equality.
    No native browser dialogs (alert/confirm/prompt) are used anywhere in this app;
    any are-you-sure needs (like Saved Rosters delete) are built as inline two-tap
    UI state instead.
  Saved Rosters: New feature this session, Terran-only so far (needs porting - see
    forward_tasks). Lets the operator save multiple NAMED snapshots of the current
    roster+battle state (not just the single auto-saved "current" state), browse/load/delete
    them from a bottom-sheet reached via a button next to "Export Army Sheet" on the
    Roster tab, and export/import individual saved rosters as .sctmg.json files for
    backup or transfer to another device/browser. Distinct from the pre-existing "Export
    Army Sheet" button, which produces a printable/display-only HTML summary, not
    a reloadable save file.
  Test Army.dc.html: A sandbox copy of Terran Army.dc.html with its own isolated localStorage
    keys (sctmg_test_v1, sctmg_play_test) so it can be broken freely without touching
    the real Terran roster. Historically where Battle-tab-style prototyping happens
    first, then kept in sync with the live faction files for structural consistency.
  dev server: python3 -m http.server 8934, served from inside the external project
    folder. Confirmed running at end of this session.
