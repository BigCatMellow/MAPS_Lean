forward_tasks:
- task_id: TASK-263
  next_action: implement
  owner: claude-lab-lili
  reason: 'Treatment script MAP_System/scripts/task_memory_claim_evidence_pilot.py
    is written and runs end to end against the frozen holdout, but metrics are weak
    and one mechanism is clearly broken: task_recall 7/23, exact_source_accuracy 11/41,
    anchored_evidence_accuracy 5/41, abstention 0/5 (ALL 5 negatives false-positive
    matched -- MIN_TASK_SCORE=6.0 threshold is too low relative to near-miss scores),
    historical_version_correctness 3/3 (this part works: per-symbol/per-heading origin
    attribution via inline TASK-XXX tags correctly resolves H01/H02/H03 to their true
    originating task rather than the newest task touching the shared file -- this
    is the core idea working as intended).

    Root cause of low recall: ClaimIndex.score_card only matches query tokens against
    each card''s own context_text (symbol name + docstring first line + ~9 lines of
    local file context / heading text). Most frozen-holdout questions are phrased
    at the task-acceptance-criteria level ("what stops the second loop from starting",
    "which mechanism enforces that distinction"), not at the raw code-identifier level,
    so many true-positive cards score near zero and lose to noise or nothing at all.

    Concrete next step (not yet done): add the origin task''s title+description+acceptance_criteria
    tokens (task_text_tokens[card["task_id"]], already computed in build_claim_cards
    but currently discarded) into each card''s matchable text, weighted LOWER than
    the local anchor context (e.g. count local-context tokens at full IDF weight,
    task-text tokens at ~0.4x weight) so exact-anchor matches still win over generic
    task-level matches, but a good task-level phrase can still surface the right card.
    After that change, recompute MIN_TASK_SCORE calibration (currently a flat 6.0,
    chosen by design reasoning only, never tuned against the frozen 28 queries --
    keep it that way; if recall improves but abstention still fails, consider a relative-margin
    abstention rule -- e.g. abstain unless best_task_score exceeds the second-best
    DIFFERENT task''s score by some ratio AND clears an absolute floor -- rather than
    just raising the flat floor, since near-miss negatives (N03 TASK-048, N04 TASK-044/047,
    N05 TASK-024) need to lose to "nothing" specifically because they lack the query''s
    distinguishing rare tokens, and a pure IDF-weighted score should already suppress
    them somewhat -- inspect per_query in the output JSON to see actual scores before
    changing the threshold blindly).

    Do NOT hand-tune per-item rules keyed to specific query IDs (P01, N04, etc.) --
    that is overfitting to the frozen answer key and would invalidate the experiment.
    Only tune general mechanisms (weighting formula, threshold shape) and re-run the
    whole 28-query set to see the aggregate effect.

    After metrics stabilize, still to do: write MAP_System/tests/test_task_memory_claim_evidence_pilot.py
    (focused tests: attribute_symbol disambiguation methods, abstention on a synthetic
    negative, historical attribution on a synthetic shared-file case, end-to-end run
    producing the same claim_card_count on a fixed corpus slice), update MAP_System/emergence/experiments/EXP-0006-*.md
    Result/Decision section with the final numbers and a recommendation (adopt/revise/reject/park
    -- revise is likely given partial success), then MAP_System/.venv/bin/python MAP_System/scripts/map_task.py
    submit TASK-263 --actor claude-lab-lili, sync mirrors, and hcom inform the lab
    plus flag for independent review per reviewer_role.'
  paths:
