lexicon:
  StarCraftCA / SCTMG / "StarCraft RPG Companion Design": 'The operator''s personal,
    non-MAP creative project - a tabletop-game

    companion web app (plain .dc.html component files plus a small Node

    build pipeline that regenerates *-data.js from uploads/*.html rules and

    unit source). Lives entirely outside this git repo at

    /home/mellow/Documents/Projects/StarCraftCA/.'
  .dc.html: 'This project''s own single-file component convention - each top-level

    screen is one file using dc-import to embed sub-components like

    UnitDetail. No native browser dialogs (alert, confirm, prompt) are used

    anywhere in this app. Screens navigate via plain anchor links to other

    .dc.html files, not an SPA router - so cross-screen state only survives

    via localStorage, read fresh on each page''s componentDidMount. Templates

    only support plain double-brace variable substitution - all conditional

    text or values must be precomputed in render() and exposed as plain

    named fields, never inlined as expressions in the template markup.'
  War Room: 'Missions.dc.html''s on-screen label. Lets the operator pick battle size,

    a mission, and a map. Shares round, phase, and VP state (the sctmg_play

    localStorage key) with Command Center.dc.html and the 3 REAL faction

    Army files (Terran, Zerg, Protoss), and also writes missionId/mapId into

    that key. Accepts an optional tab URL param (setup, missions, or maps)

    to force which of its own three sub-tabs it opens on. As of this session

    also has a "Print Sheet" button (Setup tab, next to "Briefing") that

    opens a standalone printable HTML document styled like the Army Sheet,

    containing the selected mission''s parameters/scoring/rules and the

    selected map''s zones/markers/setup instructions - separate from the

    existing plain-text "Briefing" export (openExport/exportText/copy to

    clipboard), which is unchanged.'
  Battle tab: 'A tab within each Army .dc.html file''s own bottom nav (Roster, Battle,

    Codex for Test Army; similar for the real files) - tracks per-unit model

    losses and deployment status during actual play. Shows a single-line

    badge (mission plus map combined) that links back to War Room''s Setup

    tab. Unrelated to and unchanged by this session''s Print Sheet work.'
  Export Army Sheet: 'A button on the Roster tab (Test Army.dc.html) that calls

    exportArmySheet(), building a standalone printable HTML document (own

    inline CSS via printSheetCss(), no external stylesheet) as a Blob,

    opened via URL.createObjectURL plus window.open. Header includes MISSION

    and MAP when selected. This session''s new Print Sheet export in

    Missions.dc.html deliberately mirrors this document''s visual style (same

    CSS variables/fonts/table classes) but is an independent copy, not

    shared code, and lives in a different file.'
  Print Sheet (NEW this session): 'A button on War Room''s Setup tab, next to "Briefing",
    visible whenever a

    mission or map is selected. Calls exportBattleSheet(), which opens a

    standalone printable HTML document styled like the Army Sheet, with a

    Mission section (parameters, scoring, additional rules if any, special

    rule callout) and a Map section (rendered SVG of deploy zones and

    markers, legend, red/blue setup instructions, marker placement table,

    notes). Uses the same Blob/createObjectURL/window.open/30s-auto-revoke

    pattern as Export Army Sheet.'
  missions-data.js / window.SCTMG_MISSIONS: 'Exposes MISSIONS and MAPS arrays - mission
    objects have id, name, type,

    supply, perRound, gameLength, parameters, scoring, special, and an

    optional additionalRules array (phase/name/description); map objects

    have id, name, size, type, width, height, blueZones, redZones, markers,

    redSetup, blueSetup, markerSetup, notes.'
  Test Army.dc.html: 'The operator''s sandbox/test file for this project - NOT linked
    from

    Command Center, uses an isolated sctmg_play_test localStorage key for

    its own round tracker, but reads missionId and mapId from the shared

    sctmg_play key. Not modified this session; read-only reference for the

    Print Sheet work.'
